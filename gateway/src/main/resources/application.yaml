server:
  port: 8000

spring:
  application:
    name: gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: achievement-service
            uri: http://8.230.16.157:3002
            predicates:
              - Path=/achievements/**

          - id: achievement-internal
            uri: http://8.230.16.157:3002
            predicates:
              - Path=/internal/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG