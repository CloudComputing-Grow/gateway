server:
  port: 8080

jwt:
  secret: cloud_computing_2026_grow_access_secret_key

spring:
  application:
    name: gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
              - "Content-Type"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: http://user:3001
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: http://user:3001
          predicates:
            - Path=/user,/user/**

        - id: user-service-internal
          uri: http://user:3001
          predicates:
            - Path=/api/internal/v1/users,/api/internal/v1/users/**

        - id: achievement-service
          uri: http://achievement:3002
          predicates:
            - Path=/achievements,/achievements/**

        - id: achievement-internal
          uri: http://achievement:3002
          predicates:
            - Path=/internal/**

        - id: mission-service
          uri: http://mission:3003
          predicates:
            - Path=/api/v1/missions/**

        - id: mission-admin-service
          uri: http://mission:3003
          predicates:
            - Path=/api/v1/admin/**

        - id: inventory-service
          uri: http://inventory-market:3004
          predicates:
            - Path=/api/v1/inventory/**

        - id: market-service
          uri: http://inventory-market:3004
          predicates:
            - Path=/api/v1/market/**

        - id: growth-diary-service
          uri: http://growth-diary:3005
          predicates:
            - Path=/api/v1/growth-diary/**

        - id: community-service
          uri: http://community:3006
          predicates:
            - Path=/api/v1/community/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG